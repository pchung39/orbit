# ORBIT — Aurora-1 canonical mission model
# Week-1 deliverable. Every downstream artifact (simulator, procedures,
# historical incidents, eval harness) derives from this spec. Nothing else
# starts until this is stable.
#
# version: 0.1.0
# status: draft — review against JPL-informed plausibility before building the simulator

mission:
  name: Aurora-1
  type: simulation-generated small spacecraft
  description: >
    Fictional but internally coherent small spacecraft used as ORBIT's
    primary demonstration environment for the MVP.

constants:
  baseline_avionics_load_a: 1.15
  baseline_comms_load_a: 0.35
  orbital_period_min: 96
  eclipse_fraction: 0.35
  default_sample_interval_s: 5
  battery_internal_resistance_ohm_nominal: 0.08
  heater_b_nominal_resistance_ohm: 24.0

subsystems:
  EPS:
    name: Electrical Power System
    components: [battery, solar_array, bus, avionics_load, comms_load]
  THM:
    name: Thermal Control
    components: [heater_b, battery_thermal_zone]
  PAY:
    name: Payload
    components: [payload_unit]

# ---------------------------------------------------------------------------
# CHANNEL DICTIONARY — 11 channels
# ---------------------------------------------------------------------------

channels:

  EPS.bus_voltage:
    subsystem: EPS
    unit: V
    physical_meaning: Main power bus voltage, regulated output of the power control unit
    nominal_range: [27.0, 29.5]
    warn_limit: 26.5
    critical_limit: 25.0
    limit_direction: below
    sample_interval_s: 5
    depends_on: [EPS.battery_voltage, EPS.bus_current]
    derivation: battery_voltage minus a small IR drop proportional to bus_current
    noise_stddev: 0.05

  EPS.bus_current:
    subsystem: EPS
    unit: A
    physical_meaning: Total current drawn from the bus by all loads
    nominal_range: [2.0, 4.5]
    warn_limit: 6.0
    critical_limit: 7.5
    limit_direction: above
    sample_interval_s: 5
    depends_on: [PAY.payload_current, THM.heater_b_current]
    derivation: baseline_avionics_load_a + baseline_comms_load_a + PAY.payload_current + THM.heater_b_current
    noise_stddev: 0.08

  EPS.battery_voltage:
    subsystem: EPS
    unit: V
    physical_meaning: Terminal voltage of the battery pack
    nominal_range: [26.5, 29.0]
    warn_limit: 25.5
    critical_limit: 24.5
    limit_direction: below
    sample_interval_s: 5
    depends_on: [EPS.battery_current]
    derivation: open_circuit_voltage(state_of_charge) - battery_current * effective_internal_resistance_ohm
    noise_stddev: 0.04

  EPS.battery_current:
    subsystem: EPS
    unit: A
    physical_meaning: Net current into the battery (positive charge, negative discharge)
    nominal_range: [-2.0, 3.0]
    warn_limit: 4.0
    critical_limit: 5.5
    limit_direction: above_absolute_value
    sample_interval_s: 5
    depends_on: [EPS.solar_array_current, EPS.bus_current]
    derivation: EPS.solar_array_current - EPS.bus_current
    noise_stddev: 0.05

  EPS.solar_array_current:
    subsystem: EPS
    unit: A
    physical_meaning: Current output of the solar array
    nominal_range: [0.0, 5.5]
    warn_limit: null
    critical_limit: null
    limit_direction: not_applicable
    sample_interval_s: 5
    depends_on: [orbital_phase]
    derivation: array_capacity_a * illumination_fraction(orbital_phase) * degradation_factor
    noise_stddev: 0.10
    notes: 0A in eclipse, 4.0-5.5A in full sun, ramps smoothly across the terminator

  THM.battery_temperature:
    subsystem: THM
    unit: degC
    physical_meaning: Temperature of the battery pack thermal zone
    nominal_range: [5, 25]
    warn_limit: 30
    critical_limit: 35
    limit_direction: above
    sample_interval_s: 10
    depends_on: [EPS.battery_current, THM.heater_b_current]
    derivation: first_order_lag(heat_input, thermal_time_constant_s=600)
    noise_stddev: 0.15

  THM.heater_b_temperature:
    subsystem: THM
    unit: degC
    physical_meaning: Local temperature at the Heater B mounting zone
    nominal_range: [10, 20]
    warn_limit: 40
    critical_limit: 50
    limit_direction: above
    sample_interval_s: 10
    depends_on: [THM.heater_b_current]
    derivation: first_order_lag(heater_b_current^2 * heater_b_nominal_resistance_ohm, thermal_time_constant_s=300)
    noise_stddev: 0.20

  THM.heater_b_current:
    subsystem: THM
    unit: A
    physical_meaning: Current drawn by Heater B when commanded on
    nominal_range: [0.8, 1.2]
    warn_limit: 2.0
    critical_limit: 3.0
    limit_direction: above
    sample_interval_s: 5
    depends_on: [command_state.HEATER_B]
    derivation: 0 if OFF else nominal_draw_a * active_fault_multiplier
    noise_stddev: 0.03

  PAY.power_draw:
    subsystem: PAY
    unit: W
    physical_meaning: Total electrical power drawn by the payload
    nominal_range: [0, 25]
    warn_limit: 30
    critical_limit: 35
    limit_direction: above
    sample_interval_s: 5
    depends_on: [PAY.payload_current, EPS.bus_voltage]
    derivation: PAY.payload_current * EPS.bus_voltage
    noise_stddev: 0.30

  PAY.payload_current:
    subsystem: PAY
    unit: A
    physical_meaning: Current drawn by the payload unit
    nominal_range: [0, 0.9]
    warn_limit: 1.1
    critical_limit: 1.3
    limit_direction: above
    sample_interval_s: 5
    depends_on: [PAY.mode]
    derivation: mode-dependent baseline * active_fault_multiplier
    noise_stddev: 0.02

  PAY.mode:
    subsystem: PAY
    unit: enum
    physical_meaning: Current operating mode of the payload unit
    values: [STANDBY, SCIENCE_MODE]
    sample_interval_s: 5
    depends_on: [command_state.PAYLOAD_MODE]

# ---------------------------------------------------------------------------
# MODES
# ---------------------------------------------------------------------------

modes:
  SAFE:
    description: Minimal power draw. Payload off. Entered by default or after fault detection.
    expected:
      PAY.mode: STANDBY
      THM.heater_b_current: thermostatically controlled, low duty cycle

  NOMINAL:
    description: Standard operations. Payload idle. Heaters thermostatically controlled.
    expected:
      PAY.mode: STANDBY

  SCIENCE_MODE:
    description: Payload actively collecting data. Elevated bus load.
    expected:
      PAY.mode: SCIENCE_MODE
      EPS.bus_current: elevated relative to NOMINAL

# ---------------------------------------------------------------------------
# FAULT LIBRARY — three closed families. FAULT-001 is the EPS-204 demo.
# FAULT-002 is the contrast: payload actually guilty. FAULT-003 is pack IR,
# not a load. Rules that always inhibit Heater B fail 002 and 003.
# ---------------------------------------------------------------------------

fault_library:

  HEATER_B_OVERCURRENT:
    id: FAULT-001
    hidden_root_cause: >
      Partial short in Heater B's resistive element increases its effective
      current draw for a given commanded duty cycle.
    onset: injected at a configurable timestamp during a HEATER_B_ENABLE command
    trigger: HEATER_B_ENABLE command while the fault is active
    fault_multiplier_on_heater_current: 3.2
    direct_effect: THM.heater_b_current rises to roughly 3.2x nominal when commanded on
    downstream_effects:
      - channel: EPS.bus_current
        effect: rises, since heater_b_current feeds directly into the bus current sum
      - channel: EPS.bus_voltage
        effect: sags below warn then critical threshold under sustained elevated draw
      - channel: THM.heater_b_temperature
        effect: rises faster and to a higher steady-state than nominal
      - channel: THM.battery_temperature
        effect: rises slowly afterward, from increased battery discharge current
    expected_timeline:
      t0: HEATER_B_ENABLE command
      t0_plus_5s: heater_b_current visibly elevated
      t0_plus_15_to_40s: bus_voltage crosses warn then critical threshold
      t0_plus_90s: heater_b_temperature and battery_temperature trending up
    relevant_procedure: EPS-17
    confounding_evidence: >
      PAY.mode may independently transition to SCIENCE_MODE in the same
      window (as in the EPS-204 demo scenario below), which also raises
      bus current and can mislead investigation toward the payload.
    diagnostic_evidence: >
      heater_b_current magnitude (3x+ nominal) is disproportionate to a
      mode transition alone. compare_behavior() against past
      HEATER_B_ENABLE events isolates the anomaly to the heater.

  PAYLOAD_POWER_SPIKE:
    id: FAULT-002
    hidden_root_cause: >
      Payload power converter latches into an overcurrent state on
      SCIENCE_MODE entry. Draw is ~3× the healthy science baseline.
    onset: injected at SCIENCE_MODE command
    trigger: SCIENCE_MODE while the fault is active
    fault_multiplier_on_payload_current: 3.0
    direct_effect: PAY.payload_current rises to roughly 2.7 A instead of ~0.9 A
    downstream_effects:
      - channel: PAY.power_draw
        effect: scales with current; typically crosses the 30 W warn
      - channel: EPS.bus_current
        effect: rises by the extra ~1.8 A; may stay under the 6.0 A bus warn
      - channel: EPS.bus_voltage
        effect: modest sag; this family is caught on payload current, not bus voltage
    expected_timeline:
      t0: SCIENCE_MODE command
      t0_plus_5s: payload_current above 1.1 A warn
    relevant_procedure: PAY-04
    confounding_evidence: >
      SCIENCE_MODE is supposed to raise payload current. The tell is
      magnitude: healthy science is ~0.9 A, not ~2.7 A. Heater B is off
      or healthy — do not inhibit it.
    diagnostic_evidence: >
      PAY.payload_current ≥2× the 0.9 A science baseline while
      THM.heater_b_current is not ≥2× its healthy ON draw.

  BATTERY_RESISTANCE_DEGRADATION:
    id: FAULT-003
    hidden_root_cause: >
      Pack internal resistance has grown. Terminal voltage sags under
      ordinary discharge even though every load current is healthy.
    onset: already present at the start of the window (not a load command)
    trigger: discharge current (eclipse + any enabled load)
    fault_multiplier_on_internal_resistance: 16.0
    direct_effect: EPS.battery_voltage sags below 25.5 V warn under a few amps of discharge
    downstream_effects:
      - channel: EPS.bus_voltage
        effect: follows the pack down (bus IR drop on top of the sag)
      - channel: THM.battery_temperature
        effect: extra I²R heating in the pack, slow
    expected_timeline:
      t0: eclipse and/or HEATER_B_ENABLE (healthy ~1.2 A)
      t0_plus_seconds: battery_voltage crosses 25.5 V; heater and payload currents stay nominal
    relevant_procedure: EPS-09
    confounding_evidence: >
      A heater enable in the same window looks like EPS-204 until you
      read heater current. It is ~1.2 A, not ~3.7 A.
    diagnostic_evidence: >
      Voltage sag with healthy load currents. Do not inhibit a healthy
      heater or payload; continue battery checkout.

# ---------------------------------------------------------------------------
# NEGATIVE-CAPABILITY DEMO — not a closed fault family
# ---------------------------------------------------------------------------
# marg001 / INC-0212: same command window as EPS-204, heater ~1.7× healthy.
# Bus voltage still warns, but EPS-17 step 4 (≥2×) is not met. ORBIT must
# withhold a root-cause hypothesis and recommend hold, not inhibit. Rules
# that always blame Heater B on a bus-voltage warn fail this case.

# ---------------------------------------------------------------------------
# PROCEDURES — referenced here, authored as separate markdown docs
# ---------------------------------------------------------------------------

procedures_referenced:
  EPS-17:
    title: EPS low-voltage response — check recently activated nonessential loads
    status: authored
    path: procedures/EPS-17.md
  PAY-04:
    title: Payload power spike — safe SCIENCE_MODE if draw is ≥2× healthy
    status: authored
    path: procedures/PAY-04.md
  EPS-09:
    title: Battery voltage sag — checkout pack IR before inhibiting loads
    status: authored
    path: procedures/EPS-09.md

# ---------------------------------------------------------------------------
# HISTORICAL INCIDENTS — each generated from a real run of that fault
# ---------------------------------------------------------------------------

historical_incidents_to_author:
  - id: INC-0187
    based_on: HEATER_B_OVERCURRENT
    path: incidents/INC-0187.md
    source_run: runs/inc0187.csv
    note: primary similar-incident reference for the EPS-204 demo scenario
  - id: INC-0191
    based_on: PAYLOAD_POWER_SPIKE
    path: incidents/INC-0191.md
    source_run: runs/inc0191.csv
    note: similar-incident reference when the payload is actually guilty
  - id: INC-0162
    based_on: BATTERY_RESISTANCE_DEGRADATION
    path: incidents/INC-0162.md
    source_run: runs/inc0162.csv
    note: similar-incident reference for pack IR sag with healthy loads

# ---------------------------------------------------------------------------
# DEMO SCENARIO — EPS-204, the canonical incident referenced throughout the brief
# ---------------------------------------------------------------------------

demo_scenario_EPS204:
  description: >
    HEATER_B_OVERCURRENT with a confounding SCIENCE_MODE entry — this is
    the fully polished investigation the MVP demo is built around.
  script:
    - t: "14:29:44"
      event: command
      channel: THM.heater_b_current
      action: HEATER_B_ENABLE
    - t: "14:31:52"
      event: mode_change
      channel: PAY.mode
      action: SCIENCE_MODE
    - t: "14:32:18"
      event: threshold_breach
      channel: EPS.bus_voltage
      note: crosses warn_limit
    - t: "14:32:21"
      event: threshold_breach
      channel: EPS.bus_current
      note: rises concurrently
    - t: "14:33:48"
      event: trend_start
      channel: THM.battery_temperature
      note: begins increasing

# ---------------------------------------------------------------------------
# CONTRAST SCENARIOS (v0.2)
# ---------------------------------------------------------------------------

demo_scenario_PAY002:
  description: >
    PAYLOAD_POWER_SPIKE on SCIENCE_MODE entry. Heater stays off. Entry
    alarm is PAY.payload_current, not bus voltage.
  script:
    - t: "10:12:00"
      event: mode_change
      channel: PAY.mode
      action: SCIENCE_MODE
    - t: "10:12:05"
      event: threshold_breach
      channel: PAY.payload_current
      note: crosses 1.1 A warn

demo_scenario_BATT003:
  description: >
    BATTERY_RESISTANCE_DEGRADATION in eclipse. Heater B is enabled and
    healthy. Entry alarm is EPS.battery_voltage.
  script:
    - t: "00:10:00"
      event: command
      channel: THM.heater_b_current
      action: HEATER_B_ENABLE
    - t: "00:10:05"
      event: threshold_breach
      channel: EPS.battery_voltage
      note: crosses 25.5 V warn
